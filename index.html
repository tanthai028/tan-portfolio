<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tan Thai, software engineer. Backend systems, internal tools, and automation. Projects, experience, and résumé."
    />
    <meta name="theme-color" content="#edeae5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="%SITE_URL%/" />
    <title>Tan Thai, Software Engineer</title>

    <!-- Link previews (LinkedIn, Slack, iMessage, X). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tan Thai" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Tan Thai, Software Engineer" />
    <meta property="og:description" content="Backend systems, internal tools, and automation. Selected projects and résumé." />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tan Thai, software engineer, next to color swatches for four projects" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint so there is no flash. Light is the default.
      try {
        const saved = localStorage.getItem('theme')
        if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

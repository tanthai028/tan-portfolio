<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tan — software engineer. Selected projects, experience, and contact." />
    <meta name="theme-color" content="#edeae5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tan — Portfolio</title>
    <script>
      // Apply the saved theme before first paint so there is no flash. Light is the default.
      try {
        const saved = localStorage.getItem('theme')
        if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
